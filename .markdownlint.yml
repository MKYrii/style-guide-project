# Правила markdownlint для руководства по стилю
default: true

# Длина строки не ограничивается: абзацы пишутся одной строкой
MD013: false

# Один заголовок первого уровня на файл
MD025: true

# Заголовки не заканчиваются точкой
MD026:
  punctuation: ".,;:!"

# Уровни заголовков не пропускаются
MD001: true

# Блоки кода обязаны указывать язык
MD040: true

# Маркер маркированных списков — дефис
MD004:
  style: dash

# Разрешаем HTML-комментарии и admonition-блоки не затрагиваем
MD033: false

# Ссылки без осмысленного текста запрещены
MD059: true

# Стиль разделителя таблиц не проверяем
MD060: false
